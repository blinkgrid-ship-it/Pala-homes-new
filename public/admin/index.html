<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Pala Homes — Content Admin</title>
    <link rel="icon" type="image/png" href="/favicon-32.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <!-- shown until decap-cms.js mounts into #nc-root, so the admin never
         flashes an unbranded blank/white page while it loads -->
    <div id="ph-admin-splash">
      <img src="/favicon-256.png" alt="" />
      <span>Loading Pala Homes Content Studio…</span>
    </div>

    <!-- Netlify Identity gate: only signed-in, invited users reach the CMS. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.open();
          }
        });
      }
    </script>
    <script
      src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"
      onload="setTimeout(() => document.getElementById('ph-admin-splash').classList.add('is-hidden'), 300)"
    ></script>
  </body>
</html>
