<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Pala Homes — Content Admin</title>
    <link rel="icon" type="image/png" href="/favicon-32.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <!-- shown until sveltia-cms.js mounts into #nc-root, so the admin never
         flashes an unbranded blank/white page while it loads -->
    <div id="ph-admin-splash">
      <img src="/favicon-256.png" alt="" />
      <span>Loading Pala Homes Content Studio…</span>
    </div>

    <!--
      Login is now GitHub OAuth, proxied through the /auth + /callback
      routes in worker/index.js — no Netlify Identity involved. Sveltia CMS
      reads the same config.yml as before (github backend) and opens a
      popup to /auth when the owner clicks "Log in with GitHub".
    -->
    <script
      src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"
      type="module"
      onload="setTimeout(() => document.getElementById('ph-admin-splash').classList.add('is-hidden'), 300)"
    ></script>
  </body>
</html>
