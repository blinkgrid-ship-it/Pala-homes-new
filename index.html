<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Pala Homes — Original Florida Living Concepts</title>
    <meta
      name="description"
      content="Pala Homes presents an original collection of Florida architectural concepts — cinematic visualisations combining modern Florida luxury with understated Kerala warmth. Concept demonstration, not active listings."
    />
    <meta name="theme-color" content="#071112" />
    <link rel="canonical" href="https://palahomes.example" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pala Homes" />
    <meta property="og:title" content="Pala Homes — Original Florida Living Concepts" />
    <meta
      property="og:description"
      content="A cinematic concept collection of original Florida architecture. Architectural visualisations — not active listings."
    />
    <meta property="og:image" content="/social-preview.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png" />
    <link rel="apple-touch-icon" href="/favicon-256.png" />

    <!-- fonts: display=swap for non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=Noto+Serif+Malayalam:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Netlify Forms detection: Netlify's build-time bot only scans STATIC
      HTML for <form data-netlify> — it never sees the real contact form,
      since that's rendered client-side by React. This hidden duplicate
      (never shown, never submitted) exists purely so Netlify registers the
      "contact" form and its fields. The real submission happens via fetch()
      in ContactSection.tsx, POSTing to "/" with a matching form-name.
    -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="area" />
      <input type="text" name="type" />
      <input type="text" name="use" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="whatsapp" />
      <input type="checkbox" name="consent" />
    </form>

    <!--
      Netlify Identity: required so that the invite/reset-password links the
      owner receives by email (which land on this root page as
      `/#invite_token=...`) can open the login widget and then hand off to the
      CMS at /admin. Harmless no-op if Identity isn't enabled on this site.
    -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
  </body>
</html>
